[package]
name = "sqlx"
version = "0.8.6"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/launchbadge/sqlx"
description = "Exocord's PostgreSQL-only compatibility facade for SQLx 0.8.6"

[features]
default = []
chrono = ["sqlx-core/chrono", "sqlx-postgres/chrono"]
migrate = ["sqlx-core/migrate", "sqlx-postgres/migrate"]
postgres = ["dep:sqlx-postgres"]
runtime-tokio = ["sqlx-core/_rt-tokio"]
runtime-tokio-rustls = ["runtime-tokio", "tls-rustls-ring"]
tls-rustls-ring = ["sqlx-core/_tls-rustls-ring-webpki"]
uuid = ["sqlx-core/uuid", "sqlx-postgres/uuid"]

[dependencies]
sqlx-core = { version = "=0.8.6", features = ["offline"] }
sqlx-postgres = { version = "=0.8.6", optional = true }
