name: exocord

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: exocord
      POSTGRES_USER: exocord
      POSTGRES_PASSWORD: exocord
    ports:
      - "5432:5432"
    volumes:
      - exocord-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exocord -d exocord"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - exocord-nats:/data

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.31.2
    command: ["--logtostderr"]
    ports:
      - "6379:6379"
    ulimits:
      memlock: -1

  livekit:
    image: livekit/livekit-server:v1.9.7
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  exocord-postgres:
  exocord-nats:

