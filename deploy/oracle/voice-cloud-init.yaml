#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - fail2ban
  - ufw

write_files:
  - path: /etc/ssh/sshd_config.d/60-exocord-voice.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      X11Forwarding no
  - path: /etc/sysctl.d/60-exocord-voice.conf
    owner: root:root
    permissions: "0644"
    content: |
      net.ipv4.tcp_syncookies = 1
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv6.conf.default.accept_redirects = 0
      kernel.kptr_restrict = 2

runcmd:
  - [bash, -lc, "test -e /swapfile || (fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && printf '/swapfile none swap sw 0 0\\n' >> /etc/fstab)"]
  - [sysctl, --system]
  - [bash, -lc, "if test -f /etc/iptables/rules.v4; then sed -i '/^-A INPUT -j REJECT --reject-with icmp-host-prohibited$/d' /etc/iptables/rules.v4; fi; while iptables -C INPUT -j REJECT --reject-with icmp-host-prohibited 2>/dev/null; do iptables -D INPUT -j REJECT --reject-with icmp-host-prohibited; done"]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, OpenSSH]
  - [ufw, allow, 80/tcp]
  - [ufw, allow, 443/tcp]
  - [ufw, allow, 443/udp]
  - [ufw, allow, 7881/tcp]
  - [ufw, allow, 3478/udp]
  - [ufw, allow, "50000:60000/udp"]
  - [ufw, --force, enable]
  - [systemctl, restart, ssh]
  - [systemctl, enable, --now, fail2ban]
  - [bash, -lc, "printf 'voice host base ready\\n' >/var/lib/exocord-voice-bootstrap-ready"]

final_message: "Exocord voice host base bootstrap completed after $UPTIME seconds"
